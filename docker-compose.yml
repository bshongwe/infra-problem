version: '3.8'

services:
  quotes:
    build:
      context: ./quotes
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
    networks:
      - newsfeed-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  newsfeed:
    build:
      context: ./newsfeed
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - APP_PORT=8081
    networks:
      - newsfeed-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_PORT=8000
      - STATIC_URL=http://static-assets:8001
      - QUOTE_SERVICE_URL=http://quotes:8080
      - NEWSFEED_SERVICE_URL=http://newsfeed:8081
      - NEWSFEED_SERVICE_TOKEN=T1&eWbYXNWG1w1^YGKDPxAWJ@^et^&kX
    depends_on:
      quotes:
        condition: service_healthy
      newsfeed:
        condition: service_healthy
      static-assets:
        condition: service_healthy
    networks:
      - newsfeed-network

  static-assets:
    build:
      context: ./front-end
      dockerfile: Dockerfile.static
    ports:
      - "8001:8001"
    networks:
      - newsfeed-network

networks:
  newsfeed-network:
    driver: bridge
