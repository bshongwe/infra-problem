services:
  quotes:
    build:
      context: .
      dockerfile: ./quotes/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
    networks:
      - newsfeed-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  newsfeed:
    build:
      context: .
      dockerfile: ./newsfeed/Dockerfile
    ports:
      - "8083:8081"
    environment:
      - APP_PORT=8081
    networks:
      - newsfeed-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  front-end:
    build:
      context: .
      dockerfile: ./front-end/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_PORT=8000
      - STATIC_URL=http://static-assets:8001
      - QUOTE_SERVICE_URL=http://quotes:8080
      - NEWSFEED_SERVICE_URL=http://newsfeed:8081
      - NEWSFEED_SERVICE_TOKEN=${NEWSFEED_SERVICE_TOKEN}
    depends_on:
      quotes:
        condition: service_healthy
      newsfeed:
        condition: service_healthy
      static-assets:
        condition: service_healthy
    networks:
      - newsfeed-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  static-assets:
    build:
      context: .
      dockerfile: ./front-end/Dockerfile.static
    ports:
      - "8001:8001"
    networks:
      - newsfeed-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 5s

networks:
  newsfeed-network:
    driver: bridge
